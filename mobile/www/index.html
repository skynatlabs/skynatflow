<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>flow</title>
  <style>
    /* This page only ever appears when the device cannot reach flow. It is
       deliberately self-contained — no fonts, no requests — because anything
       it had to fetch is the very thing that is unavailable. */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem;
      background: #0b1120; color: #f3f4f6;
      font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
      text-align: center;
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 1.5rem;
      border-radius: 16px; background: #487fff;
      display: grid; place-items: center;
      font-size: 1.6rem; font-weight: 700;
    }
    h1 { font-size: 1.35rem; margin: 0 0 .5rem; font-weight: 600; }
    p { margin: 0 auto; max-width: 22rem; color: #9ca3af; font-size: .95rem; line-height: 1.55; }
    button {
      margin-top: 1.75rem; padding: .7rem 1.6rem;
      border: 0; border-radius: 999px;
      background: #487fff; color: #fff;
      font-size: .95rem; font-weight: 600; font-family: inherit;
    }
    button:active { opacity: .8; }
    .hint { margin-top: 1.25rem; font-size: .78rem; color: #6b7280; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✦</div>
    <h1>Can't reach flow</h1>
    <p>You're offline, or the connection dropped. Anything you captured on this device is safe and will send itself once you're back.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="hint" id="hint"></p>
  </main>
  <script>
    // Reload the moment connectivity returns, so nobody sits looking at this
    // screen after the signal has already come back.
    window.addEventListener("online", () => location.reload());
    document.getElementById("hint").textContent =
      navigator.onLine ? "Your device says it's online — flow itself may be unreachable." : "";
  </script>
</body>
</html>
